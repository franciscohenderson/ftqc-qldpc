[project]
name = "ftqc-qldpc"
version = "0.1.0"
description = "FTQC with generalized qLDPC codes: algebra, Stim/OpenQASM3 circuits, low-latency BP-OSD/GNN decoding, Monte Carlo benchmarks"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Francisco" }]
dependencies = [
  "numpy>=2.0", "scipy>=1.13", "networkx>=3.3", "stim>=1.15", "pandas>=2.2", "pyarrow>=16", "h5py>=3.11",
  "matplotlib>=3.9", "seaborn>=0.13", "cffi>=1.16", "openqasm3[parser]>=1.0", "pytest>=8",
  "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "websockets>=12",   # live console + API tests
]

[project.optional-dependencies]
build = ["ziglang>=0.13"]      # provides `zig c++` (clang) when no system C++20 compiler is installed
gnn = ["torch>=2.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
